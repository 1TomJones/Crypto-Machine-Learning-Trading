[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-backend"
version = "0.1.0"
description = "ML-driven crypto trading platform backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # Validation & settings
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Caching / messaging
    "redis>=5.0",
    "arq>=0.26",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # Config
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.0",
    # Exchange connectivity
    "ccxt>=4.0",
    # Data science
    "pandas>=2.0",
    "numpy>=1.26",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.2",
    "optuna>=3.5",
    "shap>=0.44",
    "fracdiff>=0.1",
    # HTTP
    "httpx>=0.27",
    # Serialisation
    "orjson>=3.9",
    # Rate limiting
    "slowapi>=0.1.9",
    # Observability
    "sentry-sdk[fastapi]>=2.0",
    # Testing
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "types-passlib",
    "types-python-jose",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PTH", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401", "S101"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
